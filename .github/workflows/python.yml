name: Python tests

on:
  pull_request:
    paths: ["app/**", "scripts/**", "tests/**/*.py", "requirements.txt", "pytest.ini"]
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", "tests/**/*.py", "requirements.txt", "pytest.ini"]

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: PYTHONPATH=. pytest -q
