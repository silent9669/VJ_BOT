services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MODEL: ${MODEL:-gemini-2.0-flash}
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: nihongo_sensei
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo_data:
